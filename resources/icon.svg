<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E2A47"/>
      <stop offset="100%" stop-color="#0E5F8F"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <style>
      .tile{fill:url(#bg);}
      .stroke{fill:none;stroke:#E8F7FF;stroke-width:40;stroke-linecap:round;stroke-linejoin:round}
      .fill{fill:#E8F7FF}
      .plate{fill:#E8F7FF;opacity:0.9}
      .ion{fill:#E8F7FF;opacity:0.85}
    </style>
  </defs>

  <!-- Rounded tile -->
  <rect x="64" y="64" width="896" height="896" rx="192" class="tile" filter="url(#softShadow)"/>

  <!-- Electrode plates -->
  <rect x="304" y="280" width="40" height="480" rx="20" class="plate"/>
  <rect x="680" y="280" width="40" height="480" rx="20" class="plate"/>

  <!-- Ions drifting from anode to cathode -->
  <g>
    <circle cx="420" cy="360" r="18" class="ion"/>
    <path d="M 452 360 L 504 360" class="stroke"/>
    <circle cx="540" cy="420" r="18" class="ion"/>
    <path d="M 572 420 L 624 420" class="stroke"/>
    <circle cx="460" cy="500" r="18" class="ion"/>
    <path d="M 492 500 L 544 500" class="stroke"/>
  </g>

  <!-- Nyquist semicircle -->
  <path d="M 240 720 A 272 272 0 0 1 784 720" class="stroke"/>

  <!-- Minimal axes for EIS -->
  <path d="M 224 744 L 800 744" class="stroke" opacity="0.5"/>
  <path d="M 224 744 L 224 520" class="stroke" opacity="0.5"/>

  <!-- Electrolyte droplet (top-right) -->
  <path d="M 760 236 C 760 206 792 180 812 148 C 832 180 864 206 864 236 C 864 276 832 308 812 308 C 792 308 760 276 760 236 Z" class="stroke" />
</svg>
