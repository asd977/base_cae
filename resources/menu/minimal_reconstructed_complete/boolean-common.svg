<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Overlapping Squares -->
  <rect x="12" y="12" width="24" height="24" rx="2" stroke="#475569" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="28" y="28" width="24" height="24" rx="2" stroke="#475569" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Intersection Area (Green) -->
  <rect x="28" y="28" width="8" height="8" stroke="#2E8B80" stroke-width="3.5" fill="#2E8B80" fill-opacity="0.35" stroke-linejoin="round"/>
</svg>
